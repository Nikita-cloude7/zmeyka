<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Змейка</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#111827;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
  .game{width:92vw;max-width:520px;text-align:center}
  h1{margin:0 0 10px;font-size:34px}
  .top{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:16px;flex-wrap:wrap}.actions{display:flex;gap:5px;align-items:center}.actions button{padding:9px 11px}
  canvas{width:100%;height:auto;background:#0b1220;border:3px solid #374151;border-radius:14px;
         display:block;box-shadow:0 10px 30px #0006}
  button{border:0;border-radius:12px;background:#2563eb;color:#fff;font-size:16px;font-weight:700;
         padding:12px 18px;cursor:pointer}
  button:active{transform:scale(.97)}
  .controls{margin:16px auto 0;display:grid;grid-template-columns:repeat(3,70px);gap:8px;justify-content:center}
  .controls button{width:70px;height:58px;padding:0;font-size:26px;background:#1f2937}
  .empty{visibility:hidden}
  .hint{margin-top:12px;color:#9ca3af;font-size:14px}
</style>
</head>
<body>
<div class="game">
  <h1>🐍 Змейка</h1>
  <div class="top">
    <span>Счёт: <b id="score">0</b></span>
    <span>Скорость: <b id="speedLabel">1</b></span>
    <div class="actions">
      <button id="speedDown" type="button" aria-label="Медленнее">−</button>
      <button id="speedUp" type="button" aria-label="Быстрее">+</button>
      <button id="start" type="button">Старт</button>
      <button id="restart" type="button">Заново</button>
    </div>
  </div>
  <canvas id="game" width="500" height="500"></canvas>
  <div class="controls">
    <span class="empty"></span><button data-dir="up">⬆️</button><span class="empty"></span>
    <button data-dir="left">⬅️</button><button data-dir="down">⬇️</button><button data-dir="right">➡️</button>
  </div>
  <div class="hint">Управление: стрелки / WASD или кнопки на экране</div>
</div>
<script>
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score');
const N=20, cell=canvas.width/N;
let snake, food, dir, nextDir, score, gameOver, timer, started, speedLevel, baseInterval;

function reset(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0}; nextDir={x:1,y:0}; score=0; gameOver=false;
  speedLevel=1; baseInterval=360;
  updateSpeedLabel();
  scoreEl.textContent=score; placeFood();
  clearInterval(timer); started=false; draw();
}
function placeFood(){
  do { food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}; }
  while(snake.some(p=>p.x===food.x&&p.y===food.y));
}
function setDir(d){
  const map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
  const nd=map[d];
  if(nd && !(nd.x===-dir.x && nd.y===-dir.y)) nextDir=nd;
}
function startGame(){
  if(gameOver) reset();
  started=true;
  clearInterval(timer);
  timer=setInterval(tick,getInterval());
  draw();
}
function getInterval(){
  return Math.max(65, baseInterval - (score * 14) - ((speedLevel - 1) * 45));
}
function updateSpeedLabel(){
  const el=document.getElementById('speedLabel');
  if(el) el.textContent=String(speedLevel);
}
function changeSpeed(delta){
  speedLevel=Math.max(1,Math.min(5,speedLevel+delta));
  updateSpeedLabel();
  if(started && !gameOver){
    clearInterval(timer);
    timer=setInterval(tick,getInterval());
  }
}
function tick(){
  if(gameOver || !started)return;
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=N||head.y<0||head.y>=N||
     snake.some(p=>p.x===head.x&&p.y===head.y)){ end(); return; }
  snake.unshift(head);
  if(head.x===food.x){
    score++;
    scoreEl.textContent=score;
    placeFood();
    clearInterval(timer);
    timer=setInterval(tick,getInterval());
  } else snake.pop();
  draw();
}
function end(){
  gameOver=true; clearInterval(timer); draw();
  setTimeout(()=>alert(`Игра окончена! Счёт: ${score}`),20);
}
function draw(){
  ctx.fillStyle='#0b1220';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#162033';ctx.lineWidth=1;
  for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,canvas.height);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(canvas.width,i*cell);ctx.stroke();}
  // Еда — маленькое окно, как в доме.
  const fx=food.x*cell+3, fy=food.y*cell+3, fw=cell-6;
  ctx.fillStyle='#f5d08a';
  ctx.fillRect(fx,fy,fw,fw);
  ctx.strokeStyle='#fff7d6'; ctx.lineWidth=2;
  ctx.strokeRect(fx,fy,fw,fw);
  ctx.fillStyle='#7c5a2b';
  ctx.fillRect(fx+fw/2-1.5,fy+2,3,fw-4);
  ctx.fillRect(fx+2,fy+fw/2-1.5,fw-4,3);
  snake.forEach((p,i)=>{
    ctx.fillStyle='#22c55e';
    ctx.fillRect(p.x*cell+2,p.y*cell+2,cell-4,cell-4);
    if(i===0){
      ctx.fillStyle='#4ade80';
      ctx.fillRect(p.x*cell+2,p.y*cell+2,cell-4,cell-4);
    }
    if(i % 2 === 0){
      ctx.fillStyle='#064e3b';
      ctx.font='bold 12px system-ui';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText('Никита',p.x*cell+cell/2,p.y*cell+cell/2);
    }
  });
  if(!started && !gameOver){
    ctx.fillStyle='#0009';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 42px system-ui';
    ctx.fillText('Нажми «Старт»',canvas.width/2,canvas.height/2);
  }
  if(gameOver){
    ctx.fillStyle='#0009';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 42px system-ui';
    ctx.fillText('Игра окончена',canvas.width/2,canvas.height/2);
  }
}
document.addEventListener('keydown',e=>{
  const keys={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',
              ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
  if(keys[e.key]){e.preventDefault();setDir(keys[e.key]);}
  if(e.key==='Enter'&&gameOver)reset();
  if(e.key==='-'||e.key==='_')changeSpeed(-1);
  if(e.key==='+'||e.key==='=')changeSpeed(1);
});
document.querySelectorAll('[data-dir]').forEach(b=>{
  b.addEventListener('click',()=>setDir(b.dataset.dir));
  b.addEventListener('touchstart',e=>{e.preventDefault();setDir(b.dataset.dir);},{passive:false});
});
document.getElementById('restart').addEventListener('click',reset);
document.getElementById('start').addEventListener('click',startGame);
const speedDown=document.getElementById('speedDown');
const speedUp=document.getElementById('speedUp');
if(speedDown) speedDown.addEventListener('click',()=>changeSpeed(-1));
if(speedUp) speedUp.addEventListener('click',()=>changeSpeed(1));

let sx=0,sy=0;
canvas.addEventListener('touchstart',e=>{if(e.touches.length){sx=e.touches[0].clientX;sy=e.touches[0].clientY;}},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(!e.changedTouches.length)return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
  setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
},{passive:true});
reset();
</script>
</body>
</html>
